<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">

<title>Cuentas Claras</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#E3E9E6; --ink:#13201C; --muted:#5A6964; --line:#D5DDD9;
  --accent:#2B43C4; --accent-ink:#FFFFFF; --accent-soft:#E2E6FA;
  --in:#167544; --out:#BE3A22; --warn:#9A6410; --in-soft:#DDF1E5; --out-soft:#F8E1DB; --warn-soft:#F6EBD4;
  --shadow:0 8px 30px rgba(19,32,28,.14);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1412; --surface:#18201D; --surface-2:#222C28; --ink:#E8EFEC; --muted:#98A7A1; --line:#2D3833;
    --accent:#8C9DFF; --accent-ink:#0E1412; --accent-soft:#252C52;
    --in:#56C98C; --out:#FF8266; --warn:#E6B04F; --in-soft:#173325; --out-soft:#3A1F19; --warn-soft:#3A2E14;
    --shadow:0 8px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1412; --surface:#18201D; --surface-2:#222C28; --ink:#E8EFEC; --muted:#98A7A1; --line:#2D3833;
  --accent:#8C9DFF; --accent-ink:#0E1412; --accent-soft:#252C52;
  --in:#56C98C; --out:#FF8266; --warn:#E6B04F; --in-soft:#173325; --out-soft:#3A1F19; --warn-soft:#3A2E14;
  --shadow:0 8px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{font-family:var(--body);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:12px 150px}

/* Cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand-mark{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:15px}
.view-title{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:0;text-wrap:balance}

.demo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:13.5px}
.demo b{color:var(--warn)}

/* Hero saldo */
.hero{background:var(--ink);color:var(--bg);border-radius:22px;padding:20px 20px 16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid color-mix(in srgb,var(--bg) 8%,transparent)}
.hero .label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.hero .big{font-family:var(--display);font-weight:700;font-size:clamp(36px,11vw,48px);letter-spacing:-.03em;line-height:1.05;margin-top:4px}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--bg) 18%,transparent)}
.hero-row .k{font-size:11.5px;opacity:.65}
.hero-row .v{font-weight:600;font-size:15px}

section.block{margin-top:22px}
.block-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.block-h h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:700}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:13.5px;padding:4px 0}

.list{background:var(--surface);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left}
.row + .row{border-top:1px solid var(--line)}
button.row:active{background:var(--surface-2)}
.dot{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff}
.row .main{flex:1;min-width:0}
.row .t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;white-space:nowrap}
.amt.in{color:var(--in)} .amt.out{color:var(--ink)} .amt.tr{color:var(--muted)}
.neg{color:var(--out)}

.day-h{font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 4px 6px;display:flex;justify-content:space-between;text-transform:capitalize}
.empty{background:var(--surface);border-radius:18px;padding:22px;text-align:center;color:var(--muted)}

/* Barra de mes y filtros */
.monthbar{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:14px;padding:4px;margin-bottom:12px}
.monthbar b{font-family:var(--display);font-size:17px;text-transform:capitalize}
.iconbtn{width:40px;height:40px;border-radius:11px;border:0;background:none;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--surface-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .sw{width:10px;height:10px;border-radius:50%}
.summary3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--surface);border-radius:14px;padding:10px 12px}
.stat .k{font-size:11.5px;color:var(--muted)} .stat .v{font-weight:700;font-size:15.5px}

/* Presupuestos */
.bud{padding:14px}
.bud + .bud{border-top:1px solid var(--line)}
.bud-top{display:flex;align-items:center;gap:10px}
.bud-top .main{flex:1;min-width:0}
.bar{height:8px;border-radius:99px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--in)}
.bar.warn > i{background:var(--warn)} .bar.over > i{background:var(--out)}
.pill{font-size:11.5px;font-weight:700;border-radius:99px;padding:3px 8px;white-space:nowrap}
.pill.ok{background:var(--in-soft);color:var(--in)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.over{background:var(--out-soft);color:var(--out)} .pill.none{background:var(--surface-2);color:var(--muted)}
.bud-meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:6px}

/* Gráficos */
.card{background:var(--surface);border-radius:18px;padding:16px}
.card h3{margin:0 0 2px;font-size:15px}
.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:380px){.donut-wrap{grid-template-columns:1fr;justify-items:center}}
.legend{display:grid;gap:6px;width:100%}
.legend .li{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:13px}
.legend .sw{width:12px;height:12px;border-radius:4px}
.legend .p{color:var(--muted);font-size:12px;margin-left:4px;white-space:nowrap}
.keys{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.keys i{width:10px;height:10px;border-radius:3px;display:inline-block}
svg text{fill:var(--muted);font-family:var(--body);font-size:10.5px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 10px;border-radius:10px;box-shadow:var(--shadow);transform:translate(-50%,calc(-100% - 12px));white-space:nowrap}

/* Barra inferior y botón + */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--muted)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:31;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.96)}

/* Hoja inferior */
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(8,14,12,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.grab{height:30px;margin:-10px -16px 2px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab::before{content:"";width:44px;height:5px;border-radius:9px;background:var(--muted);opacity:.45}
.sheet > h2{touch-action:none}
.sheet h2{font-family:var(--display);font-size:21px;margin:0 0 12px;letter-spacing:-.01em}
@keyframes up{from{transform:translateY(40px);opacity:.3}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet,.sheet-back{animation:none}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:13px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount-in{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:16px 0 10px}
.amount-in input{border:0;background:none;text-align:right;font-family:var(--display);font-weight:700;font-size:46px;letter-spacing:-.03em;width:min(260px,70vw);outline:none;padding:0}
.amount-in input::placeholder{color:var(--line)}
.amount-in span{font-family:var(--display);font-size:30px;color:var(--muted);font-weight:600}
.flabel{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:14px 2px 7px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.cat{border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:9px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;font-size:13px;font-weight:600;text-align:left;line-height:1.2}
.cat .sw{width:14px;height:14px;border-radius:5px}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;width:100%}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--out-soft);color:var(--out)}
.btn.small{padding:9px 12px;font-size:13.5px;width:auto;border-radius:11px}
.actions{display:grid;gap:8px;margin-top:18px}
.err{color:var(--out);font-size:13.5px;font-weight:600;min-height:1.2em;margin-top:8px}
.note{font-size:13px;color:var(--muted)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:11px;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
textarea.field{min-height:110px;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}

.row .s.wrap{white-space:normal}
.side{display:flex;flex-direction:column;align-items:flex-end;text-align:right;flex:none}
.side .s{font-size:12px;color:var(--muted)}
.series-note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--accent-soft);border-radius:14px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.countrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.countrow .field{width:96px}
.countrow span{color:var(--muted);font-size:14px}
.preview{background:var(--surface);border-radius:14px;padding:11px 13px;margin:14px 0 0;font-size:13.5px;line-height:1.5;color:var(--ink)}
.steps p{margin:0 0 8px;font-size:14px;line-height:1.5}
.steps code{background:var(--surface-2);border-radius:6px;padding:1px 5px;font-size:13px}
.spacebar{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding-block:6px 10px}
.seg2{grid-template-columns:1fr 1fr}
.syncflag{font-size:12px;color:var(--warn);text-align:center;font-weight:600}
.auth-h{font-family:var(--display);font-size:21px;text-align:center;margin:0 0 4px;letter-spacing:-.01em}
.auth-links{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-top:12px}
.invite{background:var(--accent-soft);border-radius:16px;padding:12px 14px;margin-bottom:14px;display:grid;gap:10px;font-size:13.5px}
.invite-code{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border-radius:12px;padding:8px 8px 8px 14px}
.invite-code span{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.08em}
.debt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.debt-k{font-size:13.5px;color:var(--muted);font-weight:600}
.debt-v{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em}
.debt-row{display:flex;justify-content:space-between;padding:6px 0;font-size:14px}
.contribs{display:grid;gap:14px}
.contrib-top{display:flex;justify-content:space-between;font-size:14px}
.stack{display:flex;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:6px;gap:2px}
.stack i{display:block;height:100%}
.contrib-sub{font-size:12.5px;color:var(--muted);margin-top:4px}
.authwrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding-block:40px}
.authcard{background:var(--surface);border-radius:20px;padding:24px 22px;width:100%;max-width:360px;box-shadow:var(--shadow)}
.authcard .field{margin-top:14px}
.spin{width:26px;height:26px;border-radius:50%;border:3px solid var(--surface-2);border-top-color:var(--accent);margin:0 auto 12px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.switch{position:relative;width:46px;height:28px;border-radius:99px;background:var(--surface-2);border:0;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--in)}
.switch[aria-pressed="true"]::after{transform:translateX(18px)}
</style>

</head>
<body>
<div class="app" id="app"></div>

<button class="fab" id="fab" aria-label="Añadir movimiento">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="tabbar"><nav id="tabs">
  <button class="tab" data-tab="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button class="tab" data-tab="movimientos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Movimientos</button>
  <button class="tab" data-tab="graficos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V4M19 20v-6"/></svg>Gráficos</button>
  <button class="tab" data-tab="presupuestos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 12V4M12 12l6 5"/></svg>Presupuestos</button>
  <button class="tab" data-tab="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav></div>

<div id="sheet-root"></div>
<div class="tip" id="tip" hidden></div>

<script>
/* =========================================================
   Cuentas Claras — gestor de finanzas personales

   Sin configurar: todo se guarda solo en este dispositivo (localStorage).
   Configurando CONFIG de abajo con tu propio proyecto de Supabase: los
   datos se guardan en tu servidor, con inicio de sesión, y se pueden
   activar notificaciones push. Instrucciones completas en server/README.md.
   ========================================================= */

// La configuración real va en config.js (así no se pierde al actualizar la app)
const CONFIG = Object.assign({
  SUPABASE_URL: '',       // p.ej. 'https://abcdefgh.supabase.co'
  SUPABASE_ANON_KEY: '',  // la "anon public key" de tu proyecto
  VAPID_PUBLIC_KEY: '',   // la clave pública para notificaciones push
}, window.CUENTAS_CONFIG || {});
const CLOUD = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);

const STORAGE_KEY = 'cuentas-claras-v1';
const PALETTE = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#008300','#4a3aa7','#e34948'];
const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const eur = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR'});
const eur0 = new Intl.NumberFormat('es-ES',{style:'currency',currency:'EUR',maximumFractionDigits:0});

const pad = n => String(n).padStart(2,'0');

const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const monthOf = iso => iso.slice(0,7);
const shiftMonth = (ym, delta) => { const [y,m] = ym.split('-').map(Number); const d = new Date(y, m-1+delta, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const monthName = ym => { const [y,m] = ym.split('-').map(Number); return `${MESES[m-1]} ${y}`; };
const initials = name => name.trim().split(/\s+/).slice(0,2).map(w => w[0]).join('').toUpperCase();

function parseAmount(str){
  let s = String(str).trim().replace(/\s|€/g,'');
  if (s.includes(',') ) s = s.replace(/\./g,'').replace(',', '.');
  const n = Number(s);
  return Number.isFinite(n) ? Math.round(n*100)/100 : NaN;
}

/* ---------- Nube (Supabase) — opcional ----------
   Hay dos "espacios", cada uno con el mismo formato de datos:
     personal → tabla finance_data (solo tú)
     house    → tabla households (todos los miembros de la casa)
   Cada vez que cambias algo se sube el espacio entero. Si otra persona (o
   tu otro dispositivo) guardó antes, se descargan sus cambios, se juntan
   con los tuyos elemento a elemento (gana el cambio más reciente) y se
   vuelve a intentar. Así no se pisan los cambios de los dos. */
let cloud = null, cloudUser = null, cloudStatus = 'off';   // off | loading | ready | error
let authMode = 'login';                                    // login | signup | forgot | recovery | sent
let meId = null, myName = '';
let houseInfo = null;                                      // {id, name, code, members:[{id,name}]}
let houseChannel = null, syncState = 'ok';                 // ok | offline
const spaces = { personal: null, house: null };
const COLLS = ['accounts', 'categories', 'tx', 'recurring'];

function makeSpace(kind, id){ return {kind, id, data:null, base:{}, version:0, saving:false, dirty:false, timer:null}; }
const tableOf = sp => sp.kind === 'personal' ? {table:'finance_data', key:'user_id'} : {table:'households', key:'id'};
const activeSpace = () => spaces[ui.space] || spaces.personal;
const isHouse = () => CLOUD && ui.space === 'house' && !!spaces.house;

// Foto de cómo estaban los datos la última vez que se sincronizaron
function omitU(it){ const {u, ...rest} = it; return rest; }
function snapshotOf(d){
  const m = {};
  for (const c of COLLS) for (const it of d[c] || []) m[c + ':' + it.id] = JSON.stringify(omitU(it));
  m.__settings = JSON.stringify(d.settings || {});
  return m;
}
// Marca con la hora actual (u) todo lo que ha cambiado desde la foto
function stamp(d, base){
  const now = Date.now(); d.deleted = d.deleted || {};
  const seen = new Set();
  for (const c of COLLS) for (const it of d[c] || []){
    const k = c + ':' + it.id; seen.add(k);
    if (base[k] !== JSON.stringify(omitU(it))) it.u = now;
  }
  for (const k in base) if (k !== '__settings' && !seen.has(k)) d.deleted[k] = Math.max(d.deleted[k] || 0, now);
  if (base.__settings !== undefined && base.__settings !== JSON.stringify(d.settings || {})) d.settingsU = now;
}
// Junta dos versiones: por cada elemento gana la que se cambió más tarde
function mergeData(a, b){
  const out = {...b, ...a};
  const del = {...(b.deleted || {})};
  for (const [k, v] of Object.entries(a.deleted || {})) del[k] = Math.max(del[k] || 0, v);
  for (const c of COLLS){
    const map = new Map();
    for (const it of b[c] || []) map.set(it.id, it);
    for (const it of a[c] || []){ const o = map.get(it.id); if (!o || (it.u || 0) >= (o.u || 0)) map.set(it.id, it); }
    // se queda fuera si se borró después de su último cambio
    out[c] = [...map.values()].filter(it => { const d = del[c + ':' + it.id]; return !d || d < (it.u || 0); });
  }
  out.deleted = del;
  if ((b.settingsU || 0) > (a.settingsU || 0)){ out.settings = b.settings; out.settingsU = b.settingsU; }
  return out;
}
function sameData(a, b){
  const sa = snapshotOf(a), sb = snapshotOf(b);
  const ka = Object.keys(sa), kb = Object.keys(sb);
  if (ka.length !== kb.length || ka.some(k => sa[k] !== sb[k])) return false;
  return JSON.stringify(Object.entries(a.deleted || {}).sort()) === JSON.stringify(Object.entries(b.deleted || {}).sort());
}

function applyRemote(sp, remote){
  if (!remote) return;
  const rdata = normalize(remote.data && remote.data.accounts ? remote.data : {accounts:[], categories:[], tx:[], recurring:[]});
  if (!sp.data){ sp.data = rdata; }
  else {
    stamp(sp.data, sp.base);                          // lo pendiente queda marcado antes de juntar
    const merged = normalize(mergeData(sp.data, rdata));
    if (!sameData(merged, rdata)) sp.dirty = true;    // hay cosas nuestras que el servidor aún no tiene
    sp.data = merged;
  }
  sp.version = remote.version;
  sp.base = snapshotOf(sp.data);
  if (sp === activeSpace()) state = sp.data;
}

async function fetchSpace(sp){
  const {table, key} = tableOf(sp);
  const {data, error} = await cloud.from(table).select('data, version').eq(key, sp.id).maybeSingle();
  if (error) throw error;
  return data;
}

function queueSave(sp){
  stamp(sp.data, sp.base);
  sp.base = snapshotOf(sp.data);
  sp.dirty = true;
  writeCache();
  clearTimeout(sp.timer);
  sp.timer = setTimeout(() => flush(sp), 500);
}

async function flush(sp){
  if (!sp || !sp.dirty) return;
  if (sp.saving){ clearTimeout(sp.timer); sp.timer = setTimeout(() => flush(sp), 400); return; }
  sp.saving = true; sp.dirty = false;
  try {
    const {table, key} = tableOf(sp);
    for (let attempt = 0; attempt < 5; attempt++){
      const {data: rows, error} = await cloud.from(table)
        .update({data: sp.data, version: sp.version + 1, updated_at: new Date().toISOString()})
        .eq(key, sp.id).eq('version', sp.version).select('version');
      if (error) throw error;
      if (rows && rows.length){ sp.version = rows[0].version; break; }
      // Alguien guardó antes que nosotros: juntamos sus cambios y reintentamos
      applyRemote(sp, await fetchSpace(sp));
      sp.dirty = false;
      render();
    }
    setSync('ok');
    writeCache();
  } catch(e){
    sp.dirty = true; setSync('offline');
    clearTimeout(sp.timer); sp.timer = setTimeout(() => flush(sp), 8000);
  } finally { sp.saving = false; }
}

async function refreshSpace(sp){
  if (!sp || sp.saving) return;
  try {
    const row = await fetchSpace(sp);
    if (row && row.version !== sp.version){
      applyRemote(sp, row);
      if (runRecurring(sp.data)) sp.dirty = true;
      if (sp.dirty) queueSave(sp);
      render();
    }
    setSync('ok');
  } catch(e){ setSync('offline'); }
}

function setSync(v){ if (v !== syncState){ syncState = v; const el = document.getElementById('syncflag'); if (el) el.hidden = v === 'ok'; } }

// Copia en el móvil para que la app abra al instante y funcione sin conexión
const cacheKey = () => `cuentas-claras-cache-${meId}`;
function writeCache(){
  if (!meId) return;
  try {
    localStorage.setItem(cacheKey(), JSON.stringify({
      personal: spaces.personal && {data: spaces.personal.data, version: spaces.personal.version, base: spaces.personal.base},
      house: spaces.house && {id: spaces.house.id, data: spaces.house.data, version: spaces.house.version, base: spaces.house.base},
      houseInfo, space: ui.space,
    }));
  } catch(e){}
}
function readCache(){
  try { return JSON.parse(localStorage.getItem(cacheKey()) || 'null'); } catch(e){ return null; }
}

function initCloud(){
  cloud = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  cloud.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY'){ cloudUser = session?.user ?? null; authMode = 'recovery'; cloudStatus = 'off'; renderAuthGate(); return; }
    if (event === 'SIGNED_OUT'){ cloudUser = null; meId = null; cloudStatus = 'off'; authMode = 'login'; spaces.personal = spaces.house = null; houseInfo = null; renderAuthGate(); return; }
    if ((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && session?.user && authMode !== 'recovery'){
      cloudUser = session.user;
      if (meId !== cloudUser.id) setTimeout(bootCloud, 0);
    }
    if (event === 'INITIAL_SESSION' && !session) renderAuthGate();
  });
}

async function bootCloud(){
  meId = cloudUser.id;
  myName = cloudUser.user_metadata?.name || cloudUser.email.split('@')[0];
  spaces.personal = makeSpace('personal', meId);
  const cache = readCache();
  if (cache?.personal?.data){
    Object.assign(spaces.personal, {data: normalize(cache.personal.data), version: cache.personal.version, base: cache.personal.base || {}});
    if (cache.house?.data){ spaces.house = makeSpace('house', cache.house.id); Object.assign(spaces.house, {data: normalize(cache.house.data), version: cache.house.version, base: cache.house.base || {}}); houseInfo = cache.houseInfo; }
    if (cache.space === 'house' && spaces.house) ui.space = 'house';
    state = activeSpace().data; cloudStatus = 'ready'; startApp();   // abre ya con lo guardado en el móvil
  } else { cloudStatus = 'loading'; renderAuthGate(); }

  try {
    let row = await fetchSpace(spaces.personal);
    if (!row){
      const init = spaces.personal.data || emptyPersonal();
      const {error} = await cloud.from('finance_data').insert({user_id: meId, data: init, version: 1});
      if (error) throw error;
      row = {data: init, version: 1};
    }
    applyRemote(spaces.personal, row);
    if (spaces.personal.dirty) queueSave(spaces.personal);
    await loadHouse();
    setSync('ok');
  } catch(e){
    if (!spaces.personal.data){ cloudStatus = 'error'; renderAuthGate(); return; }
    setSync('offline');
  }
  if (!spaces.house && ui.space === 'house') ui.space = 'house';   // se queda en la pantalla de "crear o unirse"
  state = activeSpace().data;
  cloudStatus = 'ready';
  startApp();
  writeCache();
}

async function loadHouse(){
  const {data: mine, error} = await cloud.from('household_members').select('household_id').eq('user_id', meId);
  if (error) throw error;
  if (!mine.length){ spaces.house = null; houseInfo = null; if (houseChannel){ cloud.removeChannel(houseChannel); houseChannel = null; } return; }
  const hid = mine[0].household_id;
  const [{data: h, error: e1}, {data: members, error: e2}] = await Promise.all([
    cloud.from('households').select('id, name, invite_code, data, version').eq('id', hid).single(),
    cloud.from('household_members').select('user_id, display_name, joined_at').eq('household_id', hid).order('joined_at'),
  ]);
  if (e1 || e2) throw (e1 || e2);
  houseInfo = {id: hid, name: h.name, code: h.invite_code, members: members.map(m => ({id: m.user_id, name: m.display_name}))};
  if (!spaces.house || spaces.house.id !== hid) spaces.house = makeSpace('house', hid);
  const sp = spaces.house;
  if (!h.data || !h.data.accounts){            // casa recién creada: le ponemos cuentas y categorías
    if (!sp.data){ sp.data = emptyHouse(); sp.base = {}; }
    sp.version = h.version;
    queueSave(sp);
  } else applyRemote(sp, {data: h.data, version: h.version});
  if (sp.dirty) queueSave(sp);
  if (ui.space === 'house') state = sp.data;
  subscribeHouse();
}

async function loadMembers(){
  if (!houseInfo) return;
  const {data} = await cloud.from('household_members').select('user_id, display_name, joined_at').eq('household_id', houseInfo.id).order('joined_at');
  if (data){ houseInfo.members = data.map(m => ({id: m.user_id, name: m.display_name})); writeCache(); render(); }
}

function subscribeHouse(){
  if (houseChannel) cloud.removeChannel(houseChannel);
  const hid = spaces.house.id;
  houseChannel = cloud.channel('casa-' + hid)
    .on('postgres_changes', {event: 'UPDATE', schema: 'public', table: 'households', filter: `id=eq.${hid}`}, () => refreshSpace(spaces.house))
    .on('postgres_changes', {event: '*', schema: 'public', table: 'household_members', filter: `household_id=eq.${hid}`}, () => loadMembers())
    .subscribe();
}

function save(){
  if (CLOUD && cloudUser && activeSpace()){
    const sp = activeSpace();
    if (sp.data !== state) sp.data = normalize(state);   // p. ej. tras restaurar una copia
    queueSave(sp);
  } else saveLocal();
}

async function signOut(){
  for (const sp of [spaces.personal, spaces.house]) if (sp?.dirty) await flush(sp);
  try { localStorage.removeItem(cacheKey()); } catch(e){}
  await cloud.auth.signOut();
}

  tab: 'inicio',

  filterAccount: 'todas',
  lastAccount: null,
};
try { const t = localStorage.getItem(STORAGE_KEY+'-tab'); if (t) ui.tab = t; } catch(e){}

const acc = id => state.accounts.find(a => a.id === id);
const cat = id => state.categories.find(c => c.id === id);

/* ---------- Cálculos ---------- */
function balanceOf(accountId){
  const a = acc(accountId); let b = a ? Number(a.initial)||0 : 0;
  for (const t of state.tx){
    if (t.type === 'ingreso' && t.accountId === accountId) b += t.amount;
    else if (t.type === 'gasto' && t.accountId === accountId) b -= t.amount;
    else if (t.type === 'aportacion' && t.accountId === accountId) b += t.amount;
    else if (t.type === 'transferencia'){
      if (t.accountId === accountId) b -= t.amount;
      if (t.toAccountId === accountId) b += t.amount;
    }
  }
  return Math.round(b*100)/100;
}
const totalBalance = () => state.accounts.reduce((s,a) => s + balanceOf(a.id), 0);
const txOfMonth = ym => state.tx.filter(t => monthOf(t.date) === ym);
function monthTotals(ym){
  let inc = 0, out = 0;
  for (const t of txOfMonth(ym)){ if (t.type==='ingreso' || t.type==='aportacion') inc += t.amount; if (t.type==='gasto') out += t.amount; }
  return {inc, out, net: inc - out};
}
function spentByCategory(ym){
  const m = {};
  for (const t of txOfMonth(ym)) if (t.type === 'gasto') m[t.categoryId] = (m[t.categoryId]||0) + t.amount;
  return m;
}
// Cómo cambia el saldo total con un movimiento (para la gráfica de saldo)
function totalDelta(t){
  if ((t.type === 'ingreso' || t.type === 'aportacion') && t.accountId) return t.amount;
  if (t.type === 'gasto' && t.accountId) return -t.amount;
  return 0;
}

/* ---------- Casa: miembros, reparto, deudas y aportaciones ---------- */
const members = () => houseInfo?.members || [];
const memberName = id => id === meId ? 'Tú' : (members().find(m => m.id === id)?.name || 'Alguien');
const memberColor = id => PALETTE[(members().findIndex(m => m.id === id) + 4) % PALETTE.length] || PALETTE[4];
// Porcentaje que paga cada uno de los gastos comunes (por defecto, a partes iguales)
function shares(){
  const ms = members(); const cfg = state.settings?.shares || {};
  const ok = ms.length && ms.every(m => typeof cfg[m.id] === 'number') && Math.abs(ms.reduce((s, m) => s + cfg[m.id], 0) - 100) < 0.01;
  const out = {};
  ms.forEach(m => out[m.id] = ok ? cfg[m.id] / 100 : 1 / ms.length);
  return out;
}
function sharesOfTx(t){
  if (t.split && t.split.startsWith('only:')) return {[t.split.slice(5)]: 1};
  return shares();
}
function splitLabel(){
  const ms = members(), sh = shares();
  if (ms.length < 2) return 'A partes iguales';
  const vals = ms.map(m => Math.round(sh[m.id] * 100));
  if (vals.every(v => v === vals[0])) return ms.length === 2 ? 'A medias' : 'A partes iguales';
  return ms.map(m => `${m.id === meId ? 'Tú' : m.name} ${Math.round(sh[m.id]*100)} %`).join(' · ');
}
// Saldo de cada miembro: positivo = le deben dinero, negativo = debe
function houseBalances(){
  const net = {}; members().forEach(m => net[m.id] = 0);
  for (const t of state.tx){
    if (t.type === 'gasto' && t.paidBy){
      net[t.paidBy] = (net[t.paidBy] || 0) + t.amount;
      const sh = sharesOfTx(t);
      for (const id in sh) net[id] = (net[id] || 0) - t.amount * sh[id];
    }
    if (t.type === 'liquidacion'){ net[t.from] = (net[t.from] || 0) + t.amount; net[t.to] = (net[t.to] || 0) - t.amount; }
  }
  for (const id in net) net[id] = Math.round(net[id] * 100) / 100;
  return net;
}
function contributionsOf(ym){
  const out = {}; members().forEach(m => out[m.id] = 0);
  for (const t of txOfMonth(ym)) if (t.type === 'aportacion') out[t.memberId] = (out[t.memberId] || 0) + t.amount;
  return out;
}
function paidOutOfPocket(ym){
  const out = {}; members().forEach(m => out[m.id] = 0);
  for (const t of txOfMonth(ym)) if (t.type === 'gasto' && t.paidBy) out[t.paidBy] = (out[t.paidBy] || 0) + t.amount;
  return out;
}

const sortTx = list => list.slice().sort((a,b) => b.date.localeCompare(a.date) || (b.created||0) - (a.created||0));

/* ---------- Pagos programados y recurrentes ----------
   Una "regla" guarda cómo se repite un pago:
   {id, type, amount, accountId, categoryId | toAccountId, note,
    freq: 'once'|'weekly'|'monthly'|'quarterly'|'yearly',
    start: fecha del primer pago, endDate: última fecha posible o null,
    count: número total de pagos o null, last: fecha del último pago ya apuntado}
   Cada vez que se abre la app, se apuntan como movimientos normales los pagos
   cuya fecha ya ha llegado. */
const FREQS = {none:'No se repite', weekly:'Cada semana', monthly:'Cada mes', quarterly:'Cada 3 meses', yearly:'Cada año'};
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
// (funciones "normales" para poder usarlas desde sampleData, que se ejecuta antes)
function dateOf(iso){ return new Date(iso + 'T12:00:00'); }
function daysInMonth(y, m){ return new Date(y, m + 1, 0).getDate(); }
const fmtDay = (iso, withYear) => dateOf(iso).toLocaleDateString('es-ES', withYear ? {day:'numeric', month:'short', year:'numeric'} : {day:'numeric', month:'short'});
const relDay = iso => { const n = Math.round((dateOf(iso) - dateOf(today())) / 86400000); return n === 0 ? 'Hoy' : n === 1 ? 'Mañana' : `En ${n} días`; };

// Fecha del pago número i (0 = el primero). Si el día no existe en ese mes
// (un 31 en abril, por ejemplo), se usa el último día del mes.
function occurrence(rule, i){
  if (rule.freq === 'once') return i === 0 ? rule.start : null;
  const s = dateOf(rule.start);
  if (rule.freq === 'weekly'){ const d = new Date(s); d.setDate(d.getDate() + 7*i); return isoOf(d); }
  const step = {monthly:1, quarterly:3, yearly:12}[rule.freq];
  const total = s.getMonth() + step*i;
  const y = s.getFullYear() + Math.floor(total / 12), m = total % 12;
  return isoOf(new Date(y, m, Math.min(s.getDate(), daysInMonth(y, m)), 12));
}
// Recorre los pagos de una regla en orden mientras fn no devuelva false
function eachOccurrence(rule, fn){
  for (let i = 0; i < 3000; i++){
    const date = occurrence(rule, i);
    if (!date) return;
    if (rule.count && i >= rule.count) return;
    if (rule.endDate && date > rule.endDate) return;
    if (fn(date, i) === false) return;
  }
}
// Pagos que aún no se han apuntado
function pendingOccurrences(rule, max = 1, until = null){
  const out = [];
  eachOccurrence(rule, date => {
    if (until && date > until) return false;
    if (rule.last && date <= rule.last) return true;
    out.push(date); return out.length < max;
  });
  return out;
}
const nextOf = rule => pendingOccurrences(rule, 1)[0] || null;
function remainingCount(rule){
  if (rule.freq !== 'once' && !rule.count && !rule.endDate) return Infinity;
  return pendingOccurrences(rule, 3000).length;
}
function describeRule(r){
  const s = dateOf(r.start);
  if (r.freq === 'once') return `Una vez, el ${fmtDay(r.start, true)}`;
  if (r.freq === 'weekly') return `Cada ${DIAS[s.getDay()]}`;
  if (r.freq === 'monthly') return `Cada mes, el día ${s.getDate()}`;
  if (r.freq === 'quarterly') return `Cada 3 meses, el día ${s.getDate()}`;
  return `Cada año, el ${s.getDate()} de ${MESES[s.getMonth()]}`;
}
function describeEnd(r){
  if (r.freq === 'once') return '';
  if (r.count){ const left = remainingCount(r); return left ? `quedan ${left} de ${r.count}` : `${r.count} pagos, terminado`; }
  if (r.endDate) return `hasta el ${fmtDay(r.endDate, true)}`;
  return 'sin fecha de fin';
}
function ruleLabel(r){
  if (r.note) return r.note;
  if (r.type === 'transferencia') return 'Transferencia';
  if (r.type === 'aportacion') return r.memberId === meId ? 'Tu aportación' : `Aportación de ${memberName(r.memberId)}`;
  return cat(r.categoryId)?.name ?? 'Pago programado';
}
// Apunta los pagos que ya han llegado. Devuelve cuántos ha creado.
function runRecurring(s){
  const t = today(); let made = 0;
  for (const r of s.recurring || []){
    eachOccurrence(r, date => {
      if (date > t) return false;
      if (r.last && date <= r.last) return true;
      // id fijo (regla + fecha): si dos móviles lo apuntan a la vez, no se duplica
      const tx = {id:`${r.id}_${date}`, type:r.type, amount:r.amount, accountId:r.accountId ?? null, date, note:r.note || '', recurringId:r.id, created:Date.now()};
      for (const k of ['toAccountId', 'categoryId', 'paidBy', 'split', 'memberId']) if (r[k] != null) tx[k] = r[k];
      if (s.tx.some(x => x.id === tx.id) || s.deleted?.['tx:' + tx.id]){ r.last = date; return true; }
      s.tx.push(tx); r.last = date; made++;
      return true;
    });
  }
  return made;
}
// Pagos pendientes de todas las reglas hasta dentro de "days" días
function upcoming(days = 31){
  const lim = isoOf(new Date(Date.now() + days*86400000));
  const out = [];
  for (const r of state.recurring) pendingOccurrences(r, 50, lim).forEach(date => out.push({r, date}));
  return out.sort((a,b) => a.date.localeCompare(b.date));
}
// Cuánto supone al mes (aprox.) un pago que se repite
const monthlyFactor = {weekly:52/12, monthly:1, quarterly:1/3, yearly:1/12, once:0};

/* ---------- Piezas de interfaz ---------- */
const dotHTML =(color, text) => `<span class="dot" style="background:${color}">${esc(text)}</span>`;

function memberDot(id){ return `<span class="dot" style="background:${memberColor(id)}">${esc(initials(id === meId ? myName : memberName(id)))}</span>`; }
function paidByText(id){ return id === meId ? 'Pagado por ti' : `Pagado por ${memberName(id)}`; }
function settleText(t){
  if (t.from === meId) return `Pagaste a ${memberName(t.to)}`;
  if (t.to === meId) return `${memberName(t.from)} te pagó`;
  return `${memberName(t.from)} pagó a ${memberName(t.to)}`;
}
function txRow(t){
  let color, label, sub, cls, sign;
  const a = acc(t.accountId);
  if (t.type === 'aportacion'){
    return `<button class="row" data-edit="${t.id}">${memberDot(t.memberId)}
      <span class="main"><span class="t">${esc(t.note || (t.memberId === meId ? 'Tu aportación' : `Aportación de ${memberName(t.memberId)}`))}</span><span class="s">${t.recurringId ? '↻ ' : ''}Aportación · ${esc(a?.name ?? '—')}</span></span>
      <span class="amt in num">+${money(t.amount)}</span></button>`;
  }
  if (t.type === 'liquidacion'){
    return `<button class="row" data-edit="${t.id}"><span class="dot" style="background:var(--surface-2);color:var(--ink)">✓</span>
      <span class="main"><span class="t">${esc(settleText(t))}</span><span class="s">Saldar cuentas${t.note ? ' · ' + esc(t.note) : ''}</span></span>
      <span class="amt tr num">${money(t.amount)}</span></button>`;
  }
  if (t.type === 'transferencia'){
    const to = acc(t.toAccountId);
    color = 'var(--muted)'; label = t.note || 'Transferencia';
    sub = `${t.recurringId ? '↻ ' : ''}${a?.name ?? '—'} → ${to?.name ?? '—'}`; cls = 'tr'; sign = '';
    return `<button class="row" data-edit="${t.id}">
      <span class="dot" style="background:var(--surface-2);color:var(--ink)">⇄</span>
      <span class="main"><span class="t">${esc(label)}</span><span class="s">${esc(sub)}</span></span>
      <span class="amt tr num">${money(t.amount)}</span></button>`;
  }
  const c = cat(t.categoryId);
  color = c?.color ?? '#888'; label = t.note || c?.name || 'Sin categoría';
  const who = t.paidBy ? paidByText(t.paidBy) + (t.split?.startsWith('only:') ? ` · solo ${t.split.slice(5) === meId ? 'tuyo' : 'de ' + memberName(t.split.slice(5))}` : '') : (a?.name ?? '—');
  sub = `${t.recurringId ? '↻ ' : ''}${c?.name ?? 'Sin categoría'} · ${who}`;
  cls = t.type === 'ingreso' ? 'in' : 'out'; sign = t.type === 'ingreso' ? '+' : '−';
  return `<button class="row" data-edit="${t.id}">
    ${dotHTML(color, initials(c?.name ?? '?'))}
    <span class="main"><span class="t">${esc(label)}</span><span class="s">${esc(sub)}</span></span>
    <span class="amt ${cls} num">${sign}${money(t.amount)}</span></button>`;
}

function ruleRow(r, date, showEnd){
  const plus = r.type === 'ingreso' || r.type === 'aportacion';
  const signed = plus ? '+' : r.type === 'gasto' ? '−' : '';
  const cls = plus ? 'in' : r.type === 'gasto' ? 'out' : 'tr';
  const dot = r.type === 'transferencia'
    ? '<span class="dot" style="background:var(--surface-2);color:var(--ink)">⇄</span>'
    : r.type === 'aportacion' ? memberDot(r.memberId)
    : dotHTML(cat(r.categoryId)?.color ?? '#888', initials(cat(r.categoryId)?.name ?? '?'));
  const end = showEnd ? describeEnd(r) : '';
  const sub = showEnd ? `${describeRule(r)}${end ? ' · ' + end : ''}` : `${fmtDay(date)} · ${describeRule(r)}`;
  const right = showEnd ? (date ? `Próximo: ${fmtDay(date)}` : 'Terminado') : relDay(date);
  return `<button class="row" data-rule="${r.id}">${dot}
    <span class="main"><span class="t">${esc(ruleLabel(r))}</span><span class="s${showEnd ? ' wrap' : ''}">${esc(sub)}</span></span>
    <span class="side"><span class="amt ${cls} num">${signed}${money(r.amount)}</span><span class="s">${esc(right)}</span></span></button>`;
}

const monthBar = () => `<div class="monthbar">
  <button class="iconbtn" data-month="-1" aria-label="Mes anterior"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
  <b>${monthName(ui.month)}</b>
  <button class="iconbtn" data-month="1" aria-label="Mes siguiente"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
</div>`;

const demoBanner = () => state.demo ? `<div class="demo"><span><b>Datos de ejemplo.</b> Pruébalo todo; cuando quieras, empieza con tus cuentas.</span><button class="btn primary small" data-action="start-fresh">Empezar con mis datos</button></div>` : '';

function budgetState(spent, budget){
  if (!budget) return {cls:'none', label:'Sin límite', pct:0};
  const pct = spent / budget;
  if (pct > 1) return {cls:'over', label:`Pasado ${eur0.format(spent-budget)}`, pct:1};
  if (pct >= .8) return {cls:'warn', label:`${Math.round(pct*100)} %`, pct};
  return {cls:'ok', label:`${Math.round(pct*100)} %`, pct};
}

function inviteBanner(){
  if (!houseInfo || members().length > 1) return '';
  return `<div class="invite"><div><b>Invita a tu pareja.</b> En su app: Casa → Unirme con un código.</div>
    <div class="invite-code"><span class="num">${esc(houseInfo.code)}</span><button class="btn primary small" data-action="copy-code">Copiar</button></div></div>`;
}
function houseBlocks(ym){
  const ms = members();
  const net = houseBalances();
  const mes = MESES[Number(ym.slice(5)) - 1];
  // Quién debe a quién
  let debt;
  if (ms.length < 2) debt = `<p class="note" style="margin:0">Cuando tu pareja se una, aquí verás quién debe a quién.</p>`;
  else if (ms.length === 2){
    const other = ms.find(m => m.id !== meId); const mine = net[meId] || 0;
    const txt = Math.abs(mine) < 0.005 ? 'Estáis en paz' : mine > 0 ? `${esc(other.name)} te debe` : `Le debes a ${esc(other.name)}`;
    debt = `<div class="debt"><div><div class="debt-k">${txt}</div>${Math.abs(mine) >= 0.005 ? `<div class="debt-v num ${mine < 0 ? 'neg' : ''}">${money(Math.abs(mine))}</div>` : ''}</div>
      ${Math.abs(mine) >= 0.005 ? '<button class="btn ghost small" data-action="settle">Saldar</button>' : ''}</div>
      <p class="note" style="margin:8px 0 0">Cuenta los gastos que alguien pagó de su bolsillo. Reparto: ${esc(splitLabel())}.</p>`;
  } else {
    debt = `<div class="list" style="background:none">${ms.map(m => { const v = net[m.id] || 0; return `<div class="debt-row"><span>${esc(m.id === meId ? 'Tú' : m.name)}</span><span class="num ${v < 0 ? 'neg' : ''}">${Math.abs(v) < 0.005 ? 'En paz' : v > 0 ? 'le deben ' + money(v) : 'debe ' + money(-v)}</span></div>`; }).join('')}</div>
      <div class="actions" style="margin-top:8px"><button class="btn ghost small" data-action="settle">Saldar una deuda</button></div>`;
  }
  // Aportaciones del mes
  const con = contributionsOf(ym), pocket = paidOutOfPocket(ym);
  const maxV = Math.max(1, ...ms.map(m => (con[m.id] || 0) + (pocket[m.id] || 0)));
  const bars = ms.map(m => {
    const c = con[m.id] || 0, p = pocket[m.id] || 0;
    return `<div class="contrib">
      <div class="contrib-top"><span>${esc(m.id === meId ? 'Tú' : m.name)}</span><span class="num"><b>${money(c + p)}</b></span></div>
      <div class="stack"><i style="width:${(c / maxV * 100).toFixed(1)}%;background:${memberColor(m.id)}"></i><i style="width:${(p / maxV * 100).toFixed(1)}%;background:${memberColor(m.id)};opacity:.45"></i></div>
      <div class="contrib-sub num">${money(c)} a la cuenta común${p ? ` · ${money(p)} pagado de su bolsillo` : ''}</div>
    </div>`;
  }).join('');
  return `<section class="block"><div class="block-h"><h2>Entre vosotros</h2></div><div class="card">${debt}</div></section>
  <section class="block"><div class="block-h"><h2>Aportado en ${mes}</h2><button class="link" data-action="new-contribution">+ Aportación</button></div>
    <div class="card contribs">${bars}</div></section>`;
}

function upcomingBlock(){
  const up = upcoming(31);
  const ym = monthOf(today());
  const restOfMonth = up.filter(u => monthOf(u.date) === ym).reduce((sum, u) => sum + ((u.r.type === 'ingreso' || u.r.type === 'aportacion') ? u.r.amount : u.r.type === 'gasto' ? -u.r.amount : 0), 0);
  let inner;
  if (!state.recurring.length) inner = `<div class="empty">¿Tienes pagos fijos, como el alquiler, el móvil o una suscripción? Prográmalos y se apuntan solos cada mes.<div style="margin-top:12px"><button class="btn primary small" data-action="new-rule">Programar un pago</button></div></div>`;
  else if (!up.length) inner = `<div class="empty">No hay pagos programados en los próximos 30 días.</div>`;
  else inner = `<div class="list">${up.slice(0,4).map(u => ruleRow(u.r, u.date)).join('')}</div>
    ${restOfMonth ? `<p class="note" style="margin:8px 4px 0">Lo que queda de ${MESES[Number(ym.slice(5))-1]}: <b class="num">${restOfMonth>0?'+':'−'}${money(Math.abs(restOfMonth))}</b> en pagos programados.</p>` : ''}`;
  return `<section class="block">
    <div class="block-h"><h2>Próximos pagos</h2>${state.recurring.length ? '<button class="link" data-goto="programados">Gestionar</button>' : ''}</div>
    ${inner}</section>`;
}

views.programados = () => {
  const withNext = state.recurring.map(r => ({r, next: nextOf(r)}));
  const active = withNext.filter(x => x.next).sort((a,b) => a.next.localeCompare(b.next));
  const done = withNext.filter(x => !x.next);
  const perMonth = kind => active.filter(x => x.r.type === kind || (kind === 'ingreso' && x.r.type === 'aportacion')).reduce((s, x) => s + x.r.amount * monthlyFactor[x.r.freq], 0);
  const fixedOut = perMonth('gasto'), fixedIn = perMonth('ingreso');
  return `
  <header class="top" style="justify-content:flex-start">
    <button class="iconbtn" data-goto="inicio" aria-label="Volver a Inicio"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
    <h1 class="view-title">Pagos programados</h1>
  </header>
  ${active.length ? `<div class="summary3" style="grid-template-columns:1fr 1fr;margin-top:0">
    <div class="stat"><div class="k">Gastos fijos al mes</div><div class="v num">−${money(fixedOut)}</div></div>
    <div class="stat"><div class="k">Ingresos fijos al mes</div><div class="v num" style="color:var(--in)">+${money(fixedIn)}</div></div>
  </div>` : ''}
  <div class="actions" style="margin-top:12px"><button class="btn primary" data-action="new-rule">+ Programar un pago</button></div>
  <section class="block"><div class="block-h"><h2>Activos</h2></div>
    <div class="list">${active.map(x => ruleRow(x.r, x.next, true)).join('') || '<div class="empty">No tienes pagos programados activos.</div>'}</div></section>
  ${done.length ? `<section class="block"><div class="block-h"><h2>Terminados</h2></div>
    <div class="list">${done.map(x => ruleRow(x.r, null, true)).join('')}</div></section>` : ''}
  <p class="note" style="margin:14px 4px 0">Cada pago se apunta solo como un movimiento normal el día que toca, en cuanto abres la app. Los importes de gastos fijos al mes son aproximados si hay pagos semanales, trimestrales o anuales.</p>`;
};

views.movimientos = () => {
  let list = txOfMonth(ui.month);
  if (ui.filterType !== 'todos') list = list.filter(t => t.type === ui.filterType);

function donutSVG(slices, total){
  const R = 70, r = 46, cx = 75, cy = 75;
  let a0 = -Math.PI/2; const paths = [];
  const pt = (rad, a) => [cx + rad*Math.cos(a), cy + rad*Math.sin(a)];
  slices.forEach((s,i) => {
    const frac = s.v/total; const a1 = a0 + frac*2*Math.PI;
    const large = frac > .5 ? 1 : 0;
    let d;
    if (frac >= .9999){ d = `M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-.01} ${cy-R}L${cx-.01} ${cy-r}A${r} ${r} 0 1 0 ${cx} ${cy-r}Z`; }
    else {
      const [x0,y0] = pt(R,a0), [x1,y1] = pt(R,a1), [x2,y2] = pt(r,a1), [x3,y3] = pt(r,a0);
      d = `M${x0} ${y0}A${R} ${R} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${large} 0 ${x3} ${y3}Z`;
    }
    paths.push(`<path d="${d}" fill="${s.c.color}" stroke="var(--surface)" stroke-width="2" data-tip="${esc(s.c.name)}: ${money(s.v)} (${Math.round(frac*100)} %)"/>`);
    a0 = a1;
  });
  return `<svg viewBox="0 0 150 150" width="150" height="150" role="img" aria-label="Gastos por categoría">${paths.join('')}
    <text x="75" y="70" text-anchor="middle" style="font-size:10px">Gastado</text>
    <text x="75" y="88" text-anchor="middle" style="fill:var(--ink);font-weight:700;font-size:14px;font-family:var(--display)">${eur0.format(total)}</text></svg>`;
}

function niceMax(v){ if (v <= 0) return 100; const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

function barsSVG(){
  const months = Array.from({length:6}, (_,i) => shiftMonth(ui.month, i-5));
  const data = months.map(m => ({m, ...monthTotals(m)}));
  const max = niceMax(Math.max(...data.map(d => Math.max(d.inc, d.out))));
  const W = 340, H = 190, L = 44, B = 22, T = 8, plotH = H - B - T, plotW = W - L - 6;
  const y = v => T + plotH - v/max*plotH;
  const grid = [0, .5, 1].map(f => `<line x1="${L}" x2="${W-6}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(max*f)+3.5}" text-anchor="end">${eur0.format(max*f)}</text>`).join('');
  const gw = plotW/6, bw = Math.min(16, gw/2 - 5);
  const bar = (x, v, color, tip) => { const h = Math.max(v ? 2 : 0, v/max*plotH); const top = T+plotH-h; const rr = Math.min(4, h);
    return `<path d="M${x} ${T+plotH}V${top+rr}Q${x} ${top} ${x+rr} ${top}H${x+bw-rr}Q${x+bw} ${top} ${x+bw} ${top+rr}V${T+plotH}Z" fill="${color}" data-tip="${tip}"/>`; };
  const bars = data.map((d,i) => {
    const cx = L + gw*i + gw/2; const [yy, mm] = d.m.split('-').map(Number);
    const lbl = MESES_CORTOS[mm-1];
    return `<rect x="${L+gw*i}" y="${T}" width="${gw}" height="${plotH}" fill="transparent" data-tip="${monthName(d.m)} · +${money(d.inc)} / −${money(d.out)}"/>`
      + bar(cx - bw - 1, d.inc, 'var(--in)', `Ingresos ${monthName(d.m)}: ${money(d.inc)}`)
      + bar(cx + 1, d.out, 'var(--out)', `Gastos ${monthName(d.m)}: ${money(d.out)}`)
      + `<text x="${cx}" y="${H-6}" text-anchor="middle" style="${d.m===ui.month?'fill:var(--ink);font-weight:700':''}">${lbl}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ingresos y gastos por mes">${grid}${bars}</svg>`;
}

function lineSVG(){
  const months = Array.from({length:6}, (_,i) => shiftMonth(ui.month, i-5));
  const initial = state.accounts.reduce((s,a) => s + (Number(a.initial)||0), 0);
  const vals = months.map(m => {
    let b = initial;
    for (const t of state.tx) if (monthOf(t.date) <= m) b += totalDelta(t);
    return b;
  });
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const span = niceMax((hi - lo) || Math.abs(hi) || 100);
  const min = Math.floor(lo / (span/4)) * (span/4), max = min + span * 1.25;
  const W = 340, H = 150, L = 52, B = 22, T = 12, plotH = H-B-T, plotW = W-L-14;
  const x = i => L + plotW * i/5, y = v => T + plotH - (v-min)/(max-min)*plotH;
  const ticks = [min, (min+max)/2, max];
  const grid = ticks.map(v => `<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end">${eur0.format(v)}</text>`).join('');
  const pts = vals.map((v,i) => `${x(i)},${y(v)}`).join(' ');
  const area = `M${x(0)},${T+plotH} L${pts.replace(/ /g,' L')} L${x(5)},${T+plotH}Z`;
  const labels = months.map((m,i) => `<text x="${x(i)}" y="${H-6}" text-anchor="middle">${MESES_CORTOS[Number(m.slice(5))-1]}</text>`).join('');
  const dots = vals.map((v,i) => `<circle cx="${x(i)}" cy="${y(v)}" r="${i===5?5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/><rect x="${x(i)-plotW/10}" y="${T}" width="${plotW/5}" height="${plotH}" fill="transparent" data-tip="${monthName(months[i])}: ${money(v)}"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del saldo total">${grid}
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>${dots}${labels}</svg>`;
}

/* ---------- Hoja inferior ---------- */
const sheetRoot = document.getElementById('sheet-root');
function openSheet(html, mount){
  sheetRoot.innerHTML = `<div class="sheet-back" id="sheet-back"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  const back = document.getElementById('sheet-back');
  back.addEventListener('click', e => { if (e.target === back) dismissSheet(); });
  enableDragToClose(back);
  document.body.style.overflow = 'hidden';
  mount && mount(back.querySelector('.sheet'));
}
function closeSheet(){ sheetRoot.innerHTML = ''; document.body.style.overflow = ''; }

/* Cierra la hoja deslizándola hacia abajo */
function dismissSheet(){
  const back = document.getElementById('sheet-back'); if (!back) return;
  const sheet = back.querySelector('.sheet');
  sheet.style.transition = 'transform .2s ease-in';
  sheet.style.transform = `translateY(${sheet.offsetHeight + 40}px)`;
  back.style.transition = 'background-color .2s';
  back.style.backgroundColor = 'rgba(8,14,12,0)';
  setTimeout(closeSheet, 190);
}

/* Arrastrar la barrita (o el título) hacia abajo para cerrar */
function enableDragToClose(back){
  const sheet = back.querySelector('.sheet');
  let dragging = false, startY = 0, dy = 0, t0 = 0, pid = null;
  back.addEventListener('pointerdown', e => {
    if (!e.target.closest('.grab, .sheet > h2')) return;
    dragging = true; pid = e.pointerId; startY = e.clientY; dy = 0; t0 = performance.now();
    try { sheet.setPointerCapture(pid); } catch(_){}
    sheet.style.animation = 'none'; sheet.style.transition = 'none';
  });
  back.addEventListener('pointermove', e => {
    if (!dragging || e.pointerId !== pid) return;
    dy = Math.max(0, e.clientY - startY);
    sheet.style.transform = `translateY(${dy}px)`;
    const k = 1 - Math.min(1, dy / sheet.offsetHeight);
    back.style.animation = 'none';
    back.style.backgroundColor = `rgba(8,14,12,${(.45 * k).toFixed(3)})`;
  });
  const end = e => {
    if (!dragging || e.pointerId !== pid) return;
    dragging = false;
    const speed = dy / Math.max(1, performance.now() - t0);   // píxeles por milisegundo
    if (dy > Math.min(120, sheet.offsetHeight * .25) || (speed > .6 && dy > 30)) { dismissSheet(); return; }
    sheet.style.transition = 'transform .22s cubic-bezier(.2,.8,.2,1)';   // vuelve a su sitio
    sheet.style.transform = '';
    back.style.transition = 'background-color .22s';
    back.style.backgroundColor = '';
  };
  back.addEventListener('pointerup', end);
  back.addEventListener('pointercancel', end);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheetRoot.innerHTML) dismissSheet(); });

/* Confirmación dentro de la propia hoja (sin confirm()) */
function confirmInline(btn, text, onYes){
  if (btn.dataset.armed){ onYes(); return; }
  btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = text;
  setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; btn.textContent = old; } }, 3500);
}

/* ---------- Añadir / editar movimiento o pago programado ----------
   openTx()                     → nuevo movimiento
   openTx(null, {freq:'monthly'}) → nuevo pago programado (ya con "Cada mes")
   openTx(tx)                   → editar un movimiento
   openTx(null, {rule})         → editar un pago programado */
function openTx(existing, opts = {}){
  if (!state.accounts.length){ toast('Primero crea una cuenta'); openAccount(); return; }
  const rule = opts.rule || null;
  const mode = rule ? 'rule' : existing ? 'tx' : 'new';
  const base = {type:'gasto', amount:'', accountId: ui.lastAccount && acc(ui.lastAccount) ? ui.lastAccount : state.accounts[0].id,
    categoryId:null, toAccountId:null, date: today(), note:'', freq:'none', endMode:'never', endDate:'', count:'',
    paidBy:null, split:'default', memberId: meId};
  const t = rule ? {...base, ...rule, date: rule.start, freq: rule.freq === 'once' ? 'none' : rule.freq,
                    endMode: rule.count ? 'count' : rule.endDate ? 'date' : 'never', endDate: rule.endDate || '', count: rule.count || ''}
          : existing ? {...base, ...existing}
          : {...base, freq: opts.freq || 'none', type: opts.type || 'gasto'};
  if (opts.preset) Object.assign(t, opts.preset);
  if (t.split == null) t.split = 'default';
  if (!t.memberId) t.memberId = meId;
  const parentRule = mode === 'tx' && existing.recurringId ? state.recurring.find(r => r.id === existing.recurringId) : null;
  const titles = {gasto:'gasto', ingreso:'ingreso', transferencia:'transferencia', aportacion:'aportación', liquidacion:'pago entre vosotros'};
  const fem = {transferencia:true, aportacion:true};
  const house = isHouse();
  const types = house ? ['gasto','ingreso','transferencia','aportacion'] : ['gasto','ingreso','transferencia'];
  const typeLabel = {gasto:'Gasto', ingreso:'Ingreso', transferencia: house ? 'Transf.' : 'Transferencia', aportacion:'Aportación'};

  // ¿Se guardará como pago programado (y no como movimiento normal)?
  const willSchedule = () => mode === 'rule' || (mode === 'new' && (t.freq !== 'none' || (t.date && t.date > today())));
  // Regla "de prueba" con lo que hay escrito ahora, para la vista previa
  function draftRule(){
    return {start: t.date, freq: t.freq === 'none' ? 'once' : t.freq,
      endDate: t.freq !== 'none' && t.endMode === 'date' && t.endDate ? t.endDate : null,
      count: t.freq !== 'none' && t.endMode === 'count' ? (parseInt(t.count, 10) || null) : null,
      last: mode === 'rule' ? rule.last : null};
  }
  function preview(){
    if (!t.date || mode === 'tx') return '';
    const r = draftRule(); const td = today();
    if (t.freq === 'none'){
      if (t.date > td) return `Se apuntará solo el <b>${fmtDay(t.date, true)}</b>. Hasta entonces no resta de tu saldo.`;
      return '';
    }
    const all = []; eachOccurrence(r, d => { all.push(d); return all.length < 3000; });
    const pastNew = mode === 'new' ? all.filter(d => d <= td).length : 0;
    const next = all.filter(d => d > td && (!r.last || d > r.last)).slice(0, 3);
    let txt = `<b>${describeRule(r)}</b>.`;
    if (next.length) txt += ` Próximos: ${next.map(d => fmtDay(d)).join(', ')}.`;
    if ((r.count || r.endDate) && all.length) txt += ` Último pago: ${fmtDay(all[all.length-1], true)} (${all.length} en total).`;
    if (pastNew) txt += ` <br>Como el primer pago ya pasó, se apuntarán ahora ${pastNew === 1 ? 'ese pago' : `los ${pastNew} pagos que ya han pasado`}.`;
    return txt;
  }

  function body(){
    const cats = state.categories.filter(c => c.kind === (t.type === 'ingreso' ? 'ingreso' : 'gasto'));
    const memberChips = (key, exclude) => `<div class="chips">${members().filter(m => m.id !== exclude).map(m => `<button type="button" class="chip" data-pick="${key}" data-id="${m.id}" aria-pressed="${t[key]===m.id}"><span class="sw" style="background:${memberColor(m.id)}"></span>${m.id === meId ? 'Yo' : esc(m.name)}</button>`).join('')}</div>`;
    const accChips = (key, exclude) => `<div class="chips">${state.accounts.filter(a => a.id !== exclude).map(a => `<button type="button" class="chip" data-pick="${key}" data-id="${a.id}" aria-pressed="${t[key]===a.id && !(key === 'accountId' && t.paidBy && t.type === 'gasto')}"><span class="sw" style="background:${a.color}"></span>${esc(a.name)} <span class="note num">${eur0.format(balanceOf(a.id))}</span></button>`).join('')}</div>`;
    const heading = mode === 'rule' ? 'Editar pago programado' : `${mode === 'tx' ? 'Editar' : fem[t.type] ? 'Nueva' : 'Nuevo'} ${titles[t.type]}`;
    const saveLabel = mode === 'rule' ? 'Guardar cambios' : mode === 'tx' ? `Guardar ${titles[t.type]}` : willSchedule() ? `Programar ${titles[t.type]}` : `Guardar ${titles[t.type]}`;
    const pv = preview();
    return `
      <h2>${heading}</h2>
      ${parentRule ? `<div class="series-note"><span>↻ Viene de un pago programado: <b>${describeRule(parentRule)}</b>. Cambiar este movimiento no cambia los siguientes.</span><button type="button" class="btn ghost small" id="f-series">Editar la serie</button></div>` : ''}
      ${t.type === 'liquidacion' ? '' : `<div class="seg" style="grid-template-columns:repeat(${types.length},1fr)">${types.map(k => `<button type="button" data-type="${k}" aria-pressed="${t.type===k}">${typeLabel[k]}</button>`).join('')}</div>`}
      <label class="amount-in"><input id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0,00" value="${t.amount!=='' ? String(t.amount).replace('.',',') : ''}" aria-label="Importe"><span>€</span></label>
      ${t.type === 'transferencia' ? `
        <span class="flabel">Desde</span>${accChips('accountId')}
        <span class="flabel">Hacia</span>${accChips('toAccountId', t.accountId)}
      ` : t.type === 'aportacion' ? `
        <span class="flabel">Quién aporta</span>${memberChips('memberId')}
        <span class="flabel">A la cuenta</span>${accChips('accountId')}
      ` : t.type === 'liquidacion' ? `
        <span class="flabel">Paga</span>${memberChips('from')}
        <span class="flabel">Recibe</span>${memberChips('to', t.from)}
        <p class="note" style="margin:10px 2px 0">Dinero que os pasáis entre vosotros (Bizum, efectivo…) para quedar en paz. No toca las cuentas comunes.</p>
      ` : `
        <span class="flabel">Categoría</span>
        <div class="catgrid">${cats.map(c => `<button type="button" class="cat" data-pick="categoryId" data-id="${c.id}" aria-pressed="${t.categoryId===c.id}"><span class="sw" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}</div>
        <span class="flabel">${t.type==='ingreso' ? 'Entra en' : 'Pagado con'}</span>${accChips('accountId')}
        ${house && t.type === 'gasto' ? `
          <span class="flabel">O lo pagó alguien de su bolsillo</span>
          <div class="chips">${members().map(m => `<button type="button" class="chip" data-payer="${m.id}" aria-pressed="${t.paidBy===m.id}"><span class="sw" style="background:${memberColor(m.id)}"></span>${m.id === meId ? 'Yo' : esc(m.name)}</button>`).join('')}</div>
          ${t.paidBy ? `
            <span class="flabel">¿De quién es el gasto?</span>
            <div class="chips">
              <button type="button" class="chip" data-split="default" aria-pressed="${t.split==='default'}">De los dos · ${esc(splitLabel())}</button>
              ${members().map(m => `<button type="button" class="chip" data-split="only:${m.id}" aria-pressed="${t.split==='only:'+m.id}">Solo ${m.id === meId ? 'mío' : 'de ' + esc(m.name)}</button>`).join('')}
            </div>` : ''}
        ` : ''}
      `}
      <div class="two" style="margin-top:14px">
        <div><label class="flabel" for="f-date" style="margin-top:0">${t.freq !== 'none' ? 'Primer pago' : 'Fecha'}</label><input class="field" type="date" id="f-date" value="${t.date}"></div>
        <div><label class="flabel" for="f-note" style="margin-top:0">Nota</label><input class="field" id="f-note" placeholder="${t.type === 'liquidacion' ? 'Ej.: Bizum' : mode === 'tx' ? 'Opcional' : 'Ej.: Alquiler'}" value="${esc(t.note)}" maxlength="60"></div>
      </div>
      ${mode !== 'tx' && t.type !== 'liquidacion' ? `
        <span class="flabel">Repetir</span>
        <div class="chips">${Object.entries(FREQS).map(([k,l]) => `<button type="button" class="chip" data-freq="${k}" aria-pressed="${t.freq===k}">${l}</button>`).join('')}</div>
        ${t.freq !== 'none' ? `
          <span class="flabel">Termina</span>
          <div class="chips">
            <button type="button" class="chip" data-end="never" aria-pressed="${t.endMode==='never'}">Nunca</button>
            <button type="button" class="chip" data-end="date" aria-pressed="${t.endMode==='date'}">En una fecha</button>
            <button type="button" class="chip" data-end="count" aria-pressed="${t.endMode==='count'}">Tras un nº de pagos</button>
          </div>
          ${t.endMode === 'date' ? `<label class="flabel" for="f-end">Último pago como muy tarde</label><input class="field" type="date" id="f-end" value="${t.endDate}" min="${t.date}">` : ''}
          ${t.endMode === 'count' ? `<div class="countrow"><input class="field num" id="f-count" inputmode="numeric" pattern="[0-9]*" placeholder="12" value="${t.count}" aria-label="Número de pagos"><span>pagos en total</span></div>` : ''}
        ` : ''}
      ` : ''}
      ${pv ? `<p class="preview">${pv}</p>` : ''}
      <div class="err" id="f-err"></div>
      <div class="actions">
        <button class="btn primary" id="f-save">${saveLabel}</button>
        ${mode === 'tx' ? `<button class="btn danger" id="f-del">Eliminar</button>` : ''}
        ${mode === 'rule' ? `<button class="btn danger" id="f-del">Eliminar pago programado</button>` : ''}
      </div>`;
  }

  openSheet(body(), sheet => {
    const readFields = () => {
      t.amount = sheet.querySelector('#f-amount').value; t.date = sheet.querySelector('#f-date').value; t.note = sheet.querySelector('#f-note').value;
      const e = sheet.querySelector('#f-end'); if (e) t.endDate = e.value;
      const c = sheet.querySelector('#f-count'); if (c) t.count = c.value;
    };
    const rerender = () => { readFields(); const top = sheet.scrollTop; sheet.innerHTML = '<div class="grab"></div>' + body(); sheet.scrollTop = top; };
    // Al cambiar fechas o número de pagos, se actualiza la vista previa
    sheet.addEventListener('change', e => { if (e.target.matches('#f-date, #f-end, #f-count')) rerender(); });
    sheet.addEventListener('click', e => {
      const typ = e.target.closest('[data-type]');
      if (typ){ const nt = typ.dataset.type; if (nt !== t.type){ t.type = nt; t.categoryId = null; if (nt !== 'gasto') t.paidBy = null; if (nt==='transferencia'){ t.toAccountId = state.accounts.find(a => a.id !== t.accountId)?.id ?? null; } } rerender(); return; }
      const pick = e.target.closest('[data-pick]');
      if (pick){ t[pick.dataset.pick] = pick.dataset.id; if (pick.dataset.pick === 'accountId') t.paidBy = null;
        if (t.type === 'liquidacion' && t.to === t.from) t.to = members().find(m => m.id !== t.from)?.id ?? null;
        if (t.type==='transferencia' && t.toAccountId === t.accountId) t.toAccountId = state.accounts.find(a => a.id !== t.accountId)?.id ?? null; rerender(); return; }
      const fq = e.target.closest('[data-freq]'); if (fq){ t.freq = fq.dataset.freq; rerender(); return; }
      const py = e.target.closest('[data-payer]'); if (py){ t.paidBy = py.dataset.payer; rerender(); return; }
      const sp = e.target.closest('[data-split]'); if (sp){ t.split = sp.dataset.split; rerender(); return; }
      const en = e.target.closest('[data-end]'); if (en){ t.endMode = en.dataset.end; rerender(); if (t.endMode === 'count') sheet.querySelector('#f-count')?.focus(); return; }
      if (e.target.closest('#f-series')){ closeSheet(); openTx(null, {rule: parentRule}); return; }
      if (e.target.closest('#f-save')){
        readFields();
        const amount = parseAmount(t.amount);
        const err = sheet.querySelector('#f-err');
        if (!(amount > 0)) { err.textContent = 'Escribe un importe mayor que 0.'; return; }
        const needsCat = t.type === 'gasto' || t.type === 'ingreso';
        if (needsCat && !t.categoryId){ err.textContent = 'Elige una categoría.'; return; }
        if (t.type === 'aportacion' && (!t.memberId || !acc(t.accountId))){ err.textContent = 'Elige quién aporta y a qué cuenta.'; return; }
        if (t.type === 'liquidacion' && (!t.from || !t.to || t.from === t.to)){ err.textContent = 'Elige quién paga y quién recibe.'; return; }
        if ((t.type === 'gasto' || t.type === 'ingreso') && !t.paidBy && !acc(t.accountId)){ err.textContent = 'Elige con qué cuenta se pagó.'; return; }
        if (t.type === 'transferencia' && (!t.toAccountId || t.toAccountId === t.accountId)){ err.textContent = 'Elige dos cuentas distintas. Si solo tienes una, crea otra en Ajustes.'; return; }
        if (!t.date){ err.textContent = 'Elige una fecha.'; return; }

        if (willSchedule()){
          let count = null, endDate = null;
          if (t.freq !== 'none' && t.endMode === 'count'){ count = parseInt(t.count, 10); if (!(count >= 1)){ err.textContent = 'Escribe cuántos pagos habrá en total, por ejemplo 12.'; return; } }
          if (t.freq !== 'none' && t.endMode === 'date'){ if (!t.endDate || t.endDate < t.date){ err.textContent = 'La fecha de fin tiene que ser igual o posterior al primer pago.'; return; } endDate = t.endDate; }
          const r = {id: rule?.id || uid(), type:t.type, amount, note:t.note.trim(),
            freq: t.freq === 'none' ? 'once' : t.freq, start:t.date, endDate, count, last: rule?.last ?? null};
          Object.assign(r, typeFields(t));
          if (rule) state.recurring = state.recurring.map(x => x.id === r.id ? r : x); else state.recurring.push(r);
          const made = runRecurring(state);
          ui.lastAccount = t.accountId;
          closeSheet(); commit();
          const nx = nextOf(r);
          toast(made ? (made === 1 ? 'Programado. Se ha apuntado 1 pago' : `Programado. Se han apuntado ${made} pagos`)
                     : rule ? 'Pago programado actualizado' : nx ? `Programado para el ${fmtDay(nx)}` : 'Programado');
          return;
        }

        const rec = {id: t.id || uid(), type:t.type, amount, date:t.date, note:t.note.trim(), created: t.created || Date.now(), ...typeFields(t)};
        if (t.recurringId) rec.recurringId = t.recurringId;
        if (existing) state.tx = state.tx.map(x => x.id === rec.id ? rec : x); else state.tx.push(rec);
        ui.lastAccount = t.accountId;
        closeSheet(); commit(); toast(existing ? 'Cambios guardados' : `${titles[t.type][0].toUpperCase()+titles[t.type].slice(1)} ${fem[t.type] ? 'guardada' : 'guardado'}`);
        return;
      }
      const del = e.target.closest('#f-del');
      if (del && mode === 'rule') confirmInline(del, 'Pulsa otra vez. Lo ya apuntado se queda', () => { state.recurring = state.recurring.filter(x => x.id !== rule.id); closeSheet(); commit(); toast('Pago programado eliminado'); });
      else if (del) confirmInline(del, 'Pulsa otra vez para eliminar', () => { state.tx = state.tx.filter(x => x.id !== t.id); closeSheet(); commit(); toast('Movimiento eliminado'); });
    });
    if (mode === 'new') setTimeout(() => sheet.querySelector('#f-amount')?.focus(), 250);
  });
}

// Los campos que guarda cada tipo de movimiento
function typeFields(t){
  switch (t.type){
    case 'transferencia': return {accountId: t.accountId, toAccountId: t.toAccountId};
    case 'aportacion':    return {accountId: t.accountId, memberId: t.memberId};
    case 'liquidacion':   return {accountId: null, from: t.from, to: t.to};
    case 'gasto':         return t.paidBy ? {accountId: null, categoryId: t.categoryId, paidBy: t.paidBy, split: t.split || 'default'} : {accountId: t.accountId, categoryId: t.categoryId};
    default:              return {accountId: t.accountId, categoryId: t.categoryId};
  }
}

/* Saldar cuentas entre los dos */
function openSettle(){
  const ms = members(); const net = houseBalances();
  const debtor = ms.filter(m => (net[m.id] || 0) < -0.005).sort((a,b) => net[a.id] - net[b.id])[0];
  const creditor = ms.filter(m => (net[m.id] || 0) > 0.005).sort((a,b) => net[b.id] - net[a.id])[0];
  if (!debtor || !creditor){ toast('Estáis en paz'); return; }
  const amount = Math.min(-net[debtor.id], net[creditor.id]);
  openTx(null, {type:'liquidacion', preset:{from: debtor.id, to: creditor.id, amount: Math.round(amount*100)/100}});
}
