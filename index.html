let started = false;
function startApp(){
  if (CLOUD){ for (const sp of [spaces.personal, spaces.house]) if (sp?.data && runRecurring(sp.data)) queueSave(sp); }
  else if (runRecurring(state)) save();
  render();
  if (started) return;
  started = true;
  attachEvents();
}

function attachEvents(){
document.getElementById('fab').addEventListener('click', () => openTx());
document.getElementById('tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
appEl.addEventListener('click', e => {
  const el = e.target.closest('[data-edit],[data-account],[data-cat],[data-budget],[data-rule],[data-space],[data-share],[data-goto],[data-month],[data-ftype],[data-facc],[data-action]');
  if (!el) return;
  const d = el.dataset;
  if (d.edit) return openTx(state.tx.find(t => t.id === d.edit));
  if (d.account) return openAccount(d.account);
  if (d.cat) return openCategory(d.cat);
  if (d.budget) return openBudget(d.budget);
  if (d.rule){ const r = state.recurring.find(x => x.id === d.rule); if (r) openTx(null, {rule: r}); return; }
  if (d.space) return switchSpace(d.space);
  if (d.share){ const v = Number(d.share); const other = members().find(m => m.id !== meId);
    state.settings = {...(state.settings || {}), shares: {[meId]: v, [other.id]: 100 - v}}; commit(); toast('Reparto guardado'); return; }
  if (d.goto){ if (d.goto !== 'inicio') ui.month = monthOf(today()); return go(d.goto); }
  if (d.month){ ui.month = shiftMonth(ui.month, Number(d.month)); return render(); }
  if (d.ftype){ ui.filterType = d.ftype; return render(); }
  if (d.facc){ ui.filterAccount = d.facc; return render(); }
  const actions = {'new-account': () => openAccount(), 'new-cat': () => openCategory(null, d.kind), 'start-fresh': startFresh, backup, restore, reset: resetAll, signout: signOut, 'new-rule': () => openTx(null, {freq:'monthly'}),
    'house-create': () => createHouse(el), 'house-join': () => joinHouse(el), 'copy-code': () => copyCode(el), 'new-code': newCode,
    'rename-me': renameMe, 'leave-house': () => leaveHouse(el), settle: openSettle,
    'new-contribution': () => openTx(null, {type:'aportacion'})};
  actions[d.action]?.();
});
appEl.addEventListener('click', async e => {
  const t = e.target.closest('#push-toggle');
  if (!t) return;
  t.setAttribute('aria-pressed', String(pushState !== 'on'));
  if (pushState === 'on'){ await disablePush(); pushState = 'off'; toast('Notificaciones desactivadas'); }
  else { const ok = await enablePush(); pushState = ok ? 'on' : await pushSubscriptionState(); toast(ok ? 'Notificaciones activadas' : 'No se pudo activar'); }
  render();
});

/* Tooltip de los gráficos (ratón y dedo) */
const tip = document.getElementById('tip');
function showTip(e){
  const t = e.target.closest?.('[data-tip]');
  if (!t){ tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const x = Math.min(window.innerWidth - 90, Math.max(90, e.clientX));
  tip.style.left = x + 'px'; tip.style.top = e.clientY + 'px';
}
appEl.addEventListener('pointermove', showTip);
appEl.addEventListener('pointerdown', showTip);
appEl.addEventListener('pointerleave', () => tip.hidden = true);
window.addEventListener('scroll', () => tip.hidden = true, {passive:true});
// Si la app se queda abierta en segundo plano y vuelves otro día
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') { if (CLOUD) for (const sp of [spaces.personal, spaces.house]) if (sp?.dirty) flush(sp); return; }
  if (CLOUD){
    if (cloudStatus !== 'ready') return;
    for (const sp of [spaces.personal, spaces.house]) if (sp?.data){ if (runRecurring(sp.data)) queueSave(sp); if (sp.dirty) flush(sp); else refreshSpace(sp); }
    loadMembers();
    render(); return;
  }
  const n = runRecurring(state); if (n){ commit(); toast(n === 1 ? 'Se ha apuntado 1 pago programado' : `Se han apuntado ${n} pagos programados`); }
});
window.addEventListener('online', () => { if (CLOUD) for (const sp of [spaces.personal, spaces.house]) if (sp?.dirty) flush(sp); });
}

      <label class="flabel" for="au-pass">Contraseña</label><input class="field" id="au-pass" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
      <div class="err" id="au-err"></div>

    if (authMode === 'login'){
      const {error} = await cloud.auth.signInWithPassword({email, password: pass});
      if (error) return fail(/confirm/i.test(error.message) ? 'Aún no has confirmado tu correo. Busca el mensaje de confirmación (mira también en spam).' : 'Correo o contraseña incorrectos.');
    } else if (authMode === 'signup'){
      const {data, error} = await cloud.auth.signUp({email, password: pass, options: {data: {name: val('au-name')}, emailRedirectTo: appUrl()}});
      if (error) return fail(/registered|exists/i.test(error.message) ? 'Ya hay una cuenta con ese correo. Entra con tu contraseña.' : 'No se pudo crear la cuenta. Inténtalo de nuevo.');
      if (!data.session){ authSentMsg = `Te hemos mandado un correo a ${email}. Toca el enlace para confirmar la cuenta y luego vuelve aquí para entrar.`; authMode = 'sent'; renderAuthGate(); }
    } else if (authMode === 'forgot'){
      const {error} = await cloud.auth.resetPasswordForEmail(email, {redirectTo: appUrl()});
      if (error) return fail('No se pudo enviar el correo. Inténtalo en unos minutos.');
      authSentMsg = `Si hay una cuenta con ${email}, te llegará un correo con un enlace. Ábrelo y pon tu contraseña nueva; después entra desde la app.`;
      authMode = 'sent'; renderAuthGate();
    } else if (authMode === 'recovery'){
      const {error} = await cloud.auth.updateUser({password: pass});
      if (error) return fail('No se pudo cambiar. Pide otro correo de recuperación.');
      authMode = 'login'; toast('Contraseña cambiada');
      if (cloudUser){ meId = null; bootCloud(); }
    }
  };
  btn.onclick = run;
  appEl.querySelectorAll('input').forEach(i => i.addEventListener('keydown', e => { if (e.key === 'Enter') run(); }));
}
let authSentMsg = '';
const appUrl = () => location.origin + location.pathname;

/* ---------- Notificaciones push ---------- */
function urlBase64ToUint8Array(b64){
  const pad = '='.repeat((4 - b64.length % 4) % 4);
  const base64 = (b64 + pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c => c.charCodeAt(0)));
}
async function pushSubscriptionState(){
  if (!CLOUD || !('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  return sub ? 'on' : (Notification.permission === 'denied' ? 'denied' : 'off');
}
async function enablePush(){
  const reg = await navigator.serviceWorker.ready;
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return false;
  const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(CONFIG.VAPID_PUBLIC_KEY) });
  await cloud.from('push_subscriptions').upsert({ user_id: cloudUser.id, endpoint: sub.endpoint, subscription: sub.toJSON() }, { onConflict: 'endpoint' });
  return true;
}
async function disablePush(){
  const reg = await navigator.serviceWorker.ready;
  const sub = await reg.pushManager.getSubscription();
  if (sub){ await cloud.from('push_subscriptions').delete().eq('endpoint', sub.endpoint); await sub.unsubscribe(); }
}

/* ---------- Arrancar ---------- */
if (CLOUD) initCloud(); else startApp();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
